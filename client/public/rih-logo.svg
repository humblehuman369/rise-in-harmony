<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" stroke="#00D4AA" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="22" stroke="#00D4AA" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Inner filled circle -->
  <circle cx="32" cy="32" r="14" fill="#00D4AA" fill-opacity="0.12" stroke="#00D4AA" stroke-width="1.5"/>
  <!-- Sound wave / frequency symbol — three arcs emanating from center -->
  <!-- Left arcs -->
  <path d="M26 24 Q20 32 26 40" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M22 20 Q13 32 22 44" stroke="#00D4AA" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
  <!-- Right arcs -->
  <path d="M38 24 Q44 32 38 40" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M42 20 Q51 32 42 44" stroke="#00D4AA" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#00D4AA"/>
  <!-- Sparkle top -->
  <circle cx="32" cy="8" r="1.5" fill="#00D4AA" fill-opacity="0.7"/>
</svg>
