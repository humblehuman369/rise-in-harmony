name: CI

# Typecheck + unit tests + deployment-artifact builds for the web/server monorepo
# root and the mobile app.
#
# A PR must not merge if any deployable artifact fails to build, so build:web
# (Vercel), build:api (Railway rih-api), and build:alarm-dispatcher (Railway
# rih-alarm-dispatcher) are all gates here. Building is verification only —
# deploys stay deliberate and are owned by the platform Git integrations.

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-server:
    name: Web + server (typecheck, vitest, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Server unit tests
        run: npx vitest run --root . server/
      - name: Build web client (Vercel artifact)
        run: pnpm build:web
      - name: Build API (Railway rih-api artifact)
        run: pnpm build:api
      - name: Build alarm dispatcher (Railway rih-alarm-dispatcher artifact)
        run: pnpm build:alarm-dispatcher
      - name: Assert build artifacts exist
        run: |
          test -f dist/public/index.html      || { echo "::error::missing dist/public/index.html"; exit 1; }
          test -f dist/index.js               || { echo "::error::missing dist/index.js"; exit 1; }
          test -f dist/alarm-dispatcher.js    || { echo "::error::missing dist/alarm-dispatcher.js"; exit 1; }
      - name: Assert web bundle carries no Manus runtime or server secret
        run: node scripts/check-web-bundle.mjs

  mobile:
    name: Mobile app (typecheck, jest, assets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify required mobile audio assets
        working-directory: .
        run: node scripts/check-mobile-assets.mjs
      - name: Install dependencies
        # Install from monorepo root so the workspace lockfile is authoritative
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # ── Vercel promotion ────────────────────────────────────────────────────────
  #
  # Vercel's `link.productionBranch` is stuck on `main` for
  # rise-in-harmony-staging: changing it in the dashboard does not persist, and
  # it is not settable from the CLI or the REST API (PATCH /v9/projects rejects
  # both `productionBranch` and `link`). Pushes to `staging` therefore build as
  # PREVIEW, and app-staging.riseinharmony.com keeps serving whichever build was
  # promoted last by hand.
  #
  # This job closes that gap: once the gates above are green, it finds the Vercel
  # deployment for this exact commit and promotes it to production.
  #
  # Delete this job if the dashboard setting ever starts sticking. Check with:
  #   curl -H "Authorization: Bearer $VERCEL_TOKEN" \
  #     "https://api.vercel.com/v9/projects/rise-in-harmony-staging?teamId=<team>" \
  #     | jq -r '.link.productionBranch'
  promote-staging:
    name: Promote staging deployment to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only after every gate passes, and only for real pushes to staging. Never on
    # pull_request: a fork PR must not be able to publish to the staging domain.
    needs: [web-server, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: rise-in-harmony-staging
      VERCEL_SCOPE: rise-in-harmony
      DOMAIN: https://app-staging.riseinharmony.com
    steps:
      - name: Check for token
        id: guard
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping promotion; app-staging keeps the previous build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.guard.outputs.skip == 'false'
        run: npm install -g vercel@latest

      - name: Wait for the Vercel build of this commit
        if: steps.guard.outputs.skip == 'false'
        id: find
        run: |
          set -euo pipefail
          # Vercel builds in parallel with CI and can lag it on a cache miss.
          for attempt in $(seq 1 60); do
            vercel ls "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --json > /tmp/d.json 2>/dev/null || echo '[]' > /tmp/d.json
            state=$(jq -r --arg sha "$GITHUB_SHA" '(if type=="array" then . else .deployments end) | map(select(.meta.githubCommitSha == $sha)) | (.[0].state // "NONE")' /tmp/d.json)
            url=$(jq -r --arg sha "$GITHUB_SHA" '(if type=="array" then . else .deployments end) | map(select(.meta.githubCommitSha == $sha)) | (.[0].url // "")' /tmp/d.json)
            echo "attempt ${attempt}/60: state=${state}"
            if [ "$state" = "READY" ]; then
              case "$url" in https://*) ;; *) url="https://${url}" ;; esac
              echo "url=${url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "::error::Vercel build for ${GITHUB_SHA} ended as ${state} — not promoting."
              exit 1
            fi
            sleep 20
          done
          echo "::error::No READY Vercel deployment for ${GITHUB_SHA} after 20 minutes."
          exit 1

      - name: Promote to production
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          vercel promote "${{ steps.find.outputs.url }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes
          echo "Promoted ${{ steps.find.outputs.url }}"

      - name: Verify the live domain serves this build
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS "$DOMAIN" | grep -q 'id="root"'; then
              echo "SPA shell served."
              for path in /alarm /studio /gift; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "${DOMAIN}${path}")
                if [ "$code" != "200" ]; then
                  echo "::error::${path} returned ${code} — SPA rewrite is broken."
                  exit 1
                fi
                echo "  ${path} -> ${code}"
              done
              exit 0
            fi
            sleep 5
          done
          echo "::error::${DOMAIN} is not serving the SPA shell after promotion."
          exit 1
